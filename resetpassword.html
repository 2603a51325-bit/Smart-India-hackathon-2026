<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Saman Healthcare | New Password</title>
    <link rel="stylesheet" href="forgotpass.css">
</head>

<body>
    <!-- The same recovery shell keeps this page visually consistent with Forgot Password. -->
    <main class="reset-shell">
        <!-- The blue side explains that the OTP step has been completed. -->
        <section class="reset-welcome" aria-label="Saman Healthcare">
            <div class="brand"><span class="brand-mark" aria-hidden="true">+</span> <span class="brand-text">Saman
                    Healthcare</span></div>
            <div class="welcome-copy">
                <p class="eyebrow">OTP VERIFIED</p>
                <h1>Create a new password.</h1>
                <p>Choose a strong password to secure your Saman Healthcare account.</p>
            </div>
        </section>

        <!-- This form is available only after the OTP page redirects here. -->
        <section class="reset-panel">
            <div class="reset-card">
                <h2>New password</h2>
                <p class="intro-text">Enter and confirm your new password below.</p>
                <form id="passwordForm">
                    <div class="field">
                        <label for="newPassword">New password</label>
                        <input id="newPassword" type="password" minlength="8" placeholder="At least 8 characters" required>
                    </div>
                    <div class="field">
                        <label for="confirmPassword">Confirm new password</label>
                        <input id="confirmPassword" type="password" minlength="8" placeholder="Repeat your password" required>
                    </div>
                    <button class="primary-button" type="submit">Change password</button>
                </form>
                <p class="status" id="status" role="status"></p>
                <p class="back-link"><a href="loginround2.html">Back to login</a></p>
            </div>
        </section>
    </main>

    <script>
        // Read the one-time token issued after successful OTP verification.
        const resetToken = new URLSearchParams(window.location.search).get('token');
        const passwordForm = document.getElementById('passwordForm');
        const status = document.getElementById('status');
        const newPassword = document.getElementById('newPassword');
        const confirmPassword = document.getElementById('confirmPassword');

        // Prevent password changes when the page was opened without an OTP token.
        if (!resetToken) {
            passwordForm.hidden = true;
            status.textContent = 'This password reset link is invalid. Please request a new OTP.';
        }

        // Send the new password to Python only after both fields match.
        passwordForm.addEventListener('submit', async event => {
            event.preventDefault();
            if (newPassword.value !== confirmPassword.value) {
                status.textContent = 'The passwords do not match.';
                return;
            }

            status.textContent = 'Changing your password...';
            try {
                const response = await fetch('/api/forgot-password/reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ reset_token: resetToken, new_password: newPassword.value })
                });
                const result = await response.json();
                status.textContent = result.message;
                if (response.ok) {
                    setTimeout(() => { window.location.href = 'loginround2.html'; }, 900);
                }
            } catch (error) {
                status.textContent = 'Cannot connect to the Python backend.';
            }
        });
    </script>
</body>

</html>
